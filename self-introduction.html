<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介　-　あなたの名前</title>
</head>
<body>
    <h1>自己紹介</h1>
    <h2>プロフィール</h2>
    <p>名前:　岡本竜弥</p>
    <p>年齢: 21</p>
    <p>出身地: 京都</p>
    <p>趣味: ドライブ</p>
    <h2>好きなもの: </h2>
    <ul>
        <Li>りんご</Li>
        <li>みかん</li>
        <li>かき</li>
    </ul>
    <h2>今年の目標</h2>
    <ol>
        <li>プログラミングの練習をする</li>
        <li>英語を勉強する</li>
        <li>何か作る</li>
    </ol>
    <h2>リンク</h2>
    <a href="https://www.google.com/?hl=ja" target="_blank">よく使うサイト</a>
    <h2>好きな風景</h2>
    <img src="landscape.jpg" alt="好きな風景" width="400px">
    <h2>お問い合わせ</h2>
    <form action="/submit" method="post">
        <div>
            <label for="contact-name">お名前：</label>
            <input type="text" id="contact-name" name="name" required>
        </div>
        <div>
            <label for="contact-category">お問合せ種別：　</label>
            <select id="contact-category" name="category">
                <option value="">-- 選択してください --</option>
                <option value="general">一般的なお問合せ</option>
                <option value="feedback">ご意見・ご要望</option>
            </select>
        </div>
        <div>
            <label for="contact-message">お問合せ内容：</label> 
            <textarea id="contact-message" name="message" rows="5" required></textarea>
        </div>
        <div>
            <button type="submit">送信する</button>
        </div>
    </form>
</body>
</html>
